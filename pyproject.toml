[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhack-cli"
version = "0.1.0"
description = "Command-line interface for the OpenHack security platform."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenHack" }]
keywords = ["openhack", "security", "pentest", "cli", "sast", "vulnerability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://openhack.com"
Repository = "https://github.com/openhackai/cli"
Issues = "https://github.com/openhackai/cli/issues"

[project.scripts]
openhack-cli = "openhack_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["openhack_cli*"]
